<svg width="400" height="240" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #0D1117; }
    .text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #ffffff; font-size: 15px; font-weight: 600; }
    .subtext { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #8b949e; font-size: 13px; font-weight: 500; }
    .bar-bg { fill: #21262d; rx: 5; }
    .bar-py { fill: #3572A5; rx: 5; } 
    .bar-cpp { fill: #f34b7d; rx: 5; } 
    .bar-js { fill: #f1e05a; rx: 5; } 
    .bar-jup { fill: #DA5B0B; rx: 5; } 
    .pct { fill: #ffffff; font-size: 12px; font-weight: bold; font-family: monospace; }
    @keyframes load { from { width: 0; } }
    .anim { animation: load 1.2s ease-out forwards; }
  </style>
  <rect width="100%" height="100%" class="bg" rx="6" />

  <g transform="translate(20, 20)">
    <!-- Python -->
    <text x="0" y="20" class="subtext">Python</text>
    <text x="360" y="20" class="pct" text-anchor="end">48.2%</text>
    <rect x="0" y="30" width="360" height="14" class="bar-bg" />
    <rect x="0" y="30" width="173" height="14" class="bar-py anim" style="animation-delay: 0.1s" />

    <!-- C++ -->
    <text x="0" y="75" class="subtext">C++</text>
    <text x="360" y="75" class="pct" text-anchor="end">22.5%</text>
    <rect x="0" y="85" width="360" height="14" class="bar-bg" />
    <rect x="0" y="85" width="81" height="14" class="bar-cpp anim" style="animation-delay: 0.3s" />

    <!-- JavaScript -->
    <text x="0" y="130" class="subtext">JavaScript</text>
    <text x="360" y="130" class="pct" text-anchor="end">18.4%</text>
    <rect x="0" y="140" width="360" height="14" class="bar-bg" />
    <rect x="0" y="140" width="66" height="14" class="bar-js anim" style="animation-delay: 0.5s" />

    <!-- Jupyter Notebook -->
    <text x="0" y="185" class="subtext">Jupyter Notebook</text>
    <text x="360" y="185" class="pct" text-anchor="end">10.9%</text>
    <rect x="0" y="195" width="360" height="14" class="bar-bg" />
    <rect x="0" y="195" width="39" height="14" class="bar-jup anim" style="animation-delay: 0.7s" />
  </g>
</svg>
